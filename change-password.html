<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأمين الحساب | VEXORIS System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: 'class' };
      if (localStorage.getItem('theme') === 'light') {
          document.documentElement.classList.remove('dark');
      }
    </script>
    <style>
        :root {
            --bg: #04070f;
            --card-bg: rgba(15, 23, 42, 0.55);
            --card-border: rgba(148, 163, 184, 0.12);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #0ea5e9;
            --input-bg: rgba(15, 23, 42, 0.5);
        }
        html:not(.dark) {
            --bg: #f5f8fc;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(148, 163, 184, 0.28);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --input-bg: rgba(255, 255, 255, 0.9);
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg); color: var(--text-primary);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 20px; margin: 0;
        }
        .aurora-bg {
            position: fixed; inset: 0; z-index: -2;
            background: radial-gradient(ellipse 60% 50% at 15% 10%, rgba(14, 165, 233, 0.18) 0%, transparent 60%),
                        radial-gradient(ellipse 50% 45% at 85% 25%, rgba(99, 102, 241, 0.16) 0%, transparent 60%);
        }
        .setup-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 500px; width: 100%;
            box-shadow: 0 30px 60px -30px rgba(14, 165, 233, 0.35);
            position: relative; overflow: hidden;
        }
        .setup-card::before {
            content: ''; position: absolute; top: 0; right: 0; left: 0; height: 3px;
            background: linear-gradient(90deg, transparent, #0ea5e9, #6366f1, transparent);
        }
        .setup-icon {
            width: 64px; height: 64px; border-radius: 18px;
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.2), rgba(99, 102, 241, 0.15));
            border: 1px solid rgba(14, 165, 233, 0.35);
            display: flex; align-items: center; justify-content: center;
            color: var(--accent); font-size: 1.5rem;
            margin: 0 auto 16px;
        }
        .form-label {
            font-size: 0.8rem; font-weight: 800;
            color: var(--text-secondary); margin-bottom: 7px;
            display: flex; align-items: center; gap: 6px;
        }
        .form-input {
            width: 100%; padding: 12px 16px;
            background: var(--input-bg); border: 1px solid var(--card-border);
            border-radius: 11px; color: var(--text-primary);
            font-size: 0.85rem; font-weight: 600; font-family: inherit;
            transition: all 0.25s ease;
        }
        .form-input:focus {
            outline: none; border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.12);
        }
        .form-hint {
            font-size: 0.7rem; font-weight: 600;
            color: var(--text-muted); margin-top: 5px;
        }
        .btn-submit {
            width: 100%; background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
            color: white; font-weight: 800; font-size: 0.9rem;
            border: none; border-radius: 12px; padding: 14px;
            cursor: pointer; transition: all 0.3s; margin-top: 20px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5); }
        .btn-submit:disabled { opacity: 0.7; transform: none; cursor: not-allowed; }
        .error-msg {
            background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171; padding: 10px; border-radius: 8px;
            font-size: 0.8rem; font-weight: 600; margin-bottom: 16px; text-align: center;
            display: none;
        }
        .strength-bar {
            height: 4px; border-radius: 2px; background: var(--card-border);
            margin-top: 8px; overflow: hidden;
        }
        .strength-bar-fill {
            height: 100%; width: 0%; transition: all 0.3s ease;
            border-radius: 2px;
        }
        .loading-screen {
            position: fixed; inset: 0; background: var(--bg); z-index: 999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }
        .loading-screen.hide { opacity: 0; pointer-events: none; }
    </style>
    <link rel="stylesheet" href="./theme-overrides.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie_light.min.js" defer></script>
    <script src="loading-logo.js" defer></script>
    <script src="loader-buttons.js" defer></script>
</head>
<body>
    <div class="aurora-bg"></div>
    <div class="loading-screen" id="loadingScreen">
        <i class="fa-solid fa-circle-notch fa-spin text-4xl mb-4" style="color: var(--accent);"></i>
        <p class="text-sm font-bold" style="color: var(--text-secondary);">جاري التحميل...</p>
    </div>

    <div class="setup-card" id="setupCard">
        <div class="setup-icon"><i class="fa-solid fa-shield-halved"></i></div>
        <h1 class="text-2xl font-black text-center mb-2">تأمين الحساب</h1>
        <p class="text-sm font-semibold text-center mb-6" style="color: var(--text-secondary);">
            خطوة إلزامية لاستكمال تفعيل حسابك. يرجى إدخال البيانات المطلوبة.
        </p>

        <div class="error-msg" id="errorBox">حدث خطأ.</div>

        <form id="setupForm">
            <!-- حقل كلمة المرور الجديدة -->
            <div style="margin-bottom: 16px;">
                <label class="form-label">كلمة المرور الجديدة <span style="color: #ef4444;">*</span></label>
                <input type="password" id="newPassword" class="form-input" placeholder="••••••••" required>
                <div class="strength-bar">
                    <div class="strength-bar-fill" id="strengthFill"></div>
                </div>
                <div class="form-hint" id="passwordHint">
                    8 أحرف على الأقل، حرف كبير، حرف صغير، رقم، ورمز خاص.
                </div>
            </div>

            <!-- تأكيد كلمة المرور -->
            <div style="margin-bottom: 16px;">
                <label class="form-label">تأكيد كلمة المرور <span style="color: #ef4444;">*</span></label>
                <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" required>
            </div>

            <!-- رقم الهاتف الإجباري -->
            <div style="margin-bottom: 16px;">
                <label class="form-label">رقم الهاتف <span style="color: #ef4444;">*</span></label>
                <input type="tel" id="phone" class="form-input" placeholder="01xxxxxxxxx" required>
                <div class="form-hint">11 رقمًا يبدأ بـ 01</div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="fa-solid fa-check"></i> تأكيد ومتابعة
            </button>
        </form>
    </div>

    <script type="module">
        import { supabase } from './supabase-client.js';

        const form = document.getElementById('setupForm');
        const newPassword = document.getElementById('newPassword');
        const confirmPassword = document.getElementById('confirmPassword');
        const phone = document.getElementById('phone');
        const submitBtn = document.getElementById('submitBtn');
        const errorBox = document.getElementById('errorBox');
        const strengthFill = document.getElementById('strengthFill');
        const passwordHint = document.getElementById('passwordHint');

        // 1. حماية الصفحة
        (async () => {
            const { data: { session } } = await supabase.auth.getSession();
            document.getElementById('loadingScreen').classList.add('hide');
            if (!session) {
                window.location.href = './login.html';
                return;
            }
            // لو خالص، روح للداشبورد
            if (session.user.user_metadata?.password_changed) {
                if (!session.user.user_metadata?.mfa_method) {
                    window.location.href = './mfa-setup.html';
                } else {
                    window.location.href = './dashboard.html';
                }
            }
        })();

        // 2. مؤشر قوة الباسورد
        newPassword.addEventListener('input', () => {
            const val = newPassword.value;
            let score = 0;
            if (val.length >= 8) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[a-z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[!@#$%^&*]/.test(val)) score++;

            const colors = ['#ef4444', '#f59e0b', '#eab308', '#84cc16', '#10b981'];
            const widths = [20, 40, 60, 80, 100];
            
            if (val.length === 0) {
                strengthFill.style.width = '0%';
            } else {
                strengthFill.style.width = widths[score - 1] + '%';
                strengthFill.style.background = colors[score - 1];
            }
        });

        // 3. التحقق من الباسورد (نفس القواعد)
        function isValidPassword(pw) {
            return /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*]).{8,}$/.test(pw);
        }

        // 4. التحقق من رقم الهاتف المصري
        function isValidPhone(ph) {
            return /^01[0125][0-9]{8}$/.test(ph);
        }

        // 5. حفظ البيانات
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.style.display = 'none';

            const pw = newPassword.value;
            const confirm = confirmPassword.value;
            const ph = phone.value.trim();

            // التحقق
            if (!isValidPassword(pw)) {
                showError('كلمة المرور لا تحقق الشروط. تأكد من وجود حرف كبير، صغير، رقم، ورمز خاص، وطول 8 أحرف على الأقل.');
                return;
            }
            if (pw !== confirm) {
                showError('كلمتا المرور غير متطابقتين.');
                return;
            }
            if (!isValidPhone(ph)) {
                showError('رقم الهاتف غير صحيح. يجب أن يكون 11 رقمًا يبدأ بـ 01.');
                return;
            }

            // إرسال البيانات
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> جاري الحفظ...';

            const { data, error } = await supabase.auth.updateUser({
                password: pw,
                data: {
                    password_changed: true,
                    phone: ph
                }
            });

            if (error) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> تأكيد ومتابعة';
                showError(error.message);
                return;
            }

            // نجاح
            submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> تم الحفظ بنجاح';
            submitBtn.style.background = '#10b981';
            
            setTimeout(() => {
                window.location.href = './mfa-setup.html';
            }, 1000);
        });

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.style.display = 'block';
        }
    </script>
</body>
</html>
