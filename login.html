<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | VEXORIS System</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: 'class' };
      // تطبيق الثيم المحفوظ فوري قبل التحميل لمنع أي وميض أو تغيير مفاجئ
      if (localStorage.getItem('theme') === 'light') {
          document.documentElement.classList.remove('dark');
      }
    </script>
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="min-h-screen flex flex-col justify-between bg-grid-pattern selection:bg-sky-500 selection:text-slate-950">

    <div class="app-container flex flex-col min-h-screen">
        
        <!-- Unified Navbar -->
        <header class="custom-card sticky top-0 z-50 px-8 py-4 my-4 rounded-2xl flex items-center justify-between border">
            <div class="flex items-center gap-3">
                <div class="w-3.5 h-3.5 rounded-full bg-sky-500 shadow-md shadow-sky-500/50 animate-pulse"></div>
                <a href="index.html" class="text-xl font-black tracking-wider bg-gradient-to-r from-sky-500 to-indigo-600 bg-clip-text text-transparent">VEXORIS</a>
            </div>
            
            <div class="flex items-center gap-6">
                <nav class="hidden md:flex items-center gap-6 text-sm font-semibold">
                    <a href="index.html" class="hover:text-sky-500 transition-colors opacity-80 hover:opacity-100">الرئيسية</a>
                    <a href="about.html" class="hover:text-sky-500 transition-colors opacity-80 hover:opacity-100">عن النظام</a>
                    <a href="contact.html" class="hover:text-sky-500 transition-colors opacity-80 hover:opacity-100">تواصل معنا</a>
                    <a href="courses.html" class="hover:text-sky-500 transition-colors opacity-80 hover:opacity-100">دورات تدريبية</a>
                    <a href="feedback.html" class="hover:text-sky-500 transition-colors opacity-80 hover:opacity-100">رأيك يهمنا</a>
                </nav>

                <div class="flex items-center gap-3">
                    <button onclick="toggleTheme()" class="btn btn-ghost btn-circle btn-sm text-sky-500 border border-sky-500/30 hover:bg-sky-500/10" title="تبديل الثيم">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- Professional Login Content -->
        <main class="flex-grow flex items-center justify-center py-12">
            <div class="custom-card p-8 sm:p-10 rounded-3xl w-full max-w-md shadow-2xl border relative overflow-hidden">
                
                <!-- Glow Accent -->
                <div class="absolute -top-12 -right-12 w-32 h-32 bg-sky-500/10 rounded-full blur-2xl pointer-events-none"></div>

                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-sky-500/10 text-sky-500 mb-4 border border-sky-500/20">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                    </div>
                    <h1 class="text-2xl font-black tracking-tight mb-2">تسجيل الدخول الآمن</h1>
                    <p class="text-xs opacity-75">أدخل بيانات الاعتماد المؤسسية للوصول إلى المنظومة</p>
                </div>

                <form onsubmit="handleLogin(event)" class="space-y-5">
                    <div>
                        <label class="block text-xs font-bold mb-2 opacity-90">البريد الإلكتروني المؤسسي</label>
                        <input type="email" id="email" required placeholder="name@vexoris.system" class="input input-bordered w-full bg-transparent focus:border-sky-500 text-sm" />
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="text-xs font-bold opacity-90">كلمة المرور</label>
                            <a href="#" onclick="alert('يرجى مراجعة مسؤول النظام لإعادة ضبط كلمة المرور'); return false;" class="text-xs text-sky-500 hover:underline">نسيت كلمة المرور؟</a>
                        </div>
                        <input type="password" id="password" required placeholder="••••••••" class="input input-bordered w-full bg-transparent focus:border-sky-500 text-sm" />
                    </div>

                    <div class="flex items-center justify-between text-xs py-1">
                        <label class="cursor-pointer flex items-center gap-2">
                            <input type="checkbox" checked class="checkbox checkbox-xs checkbox-info" />
                            <span class="opacity-80">تذكر هذا الجهاز</span>
                        </label>
                    </div>

                    <button type="submit" class="btn bg-sky-500 hover:bg-sky-600 text-slate-950 font-black w-full border-none shadow-lg shadow-sky-500/20 text-sm">
                        دخول النظام
                    </button>
                </form>

            </div>
        </main>

        <!-- Footer -->
        <footer class="custom-card py-6 mb-4 rounded-2xl text-center text-xs opacity-75 border">
            <p class="mono-font">VEXORIS Enterprise Security Module © 2026</p>
        </footer>
    </div>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
        }

        function handleLogin(e) {
            e.preventDefault();
            alert('تم التوثيق بنجاح! جاري التوجيه إلى لوحة التحكم...');
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
