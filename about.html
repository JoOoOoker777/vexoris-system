<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عن النظام | VEXORIS System</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: 'class' };
      if (localStorage.getItem('theme') === 'light') { document.documentElement.classList.remove('dark'); }
    </script>
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="min-h-screen flex flex-col justify-between bg-grid-pattern">
    <div class="app-container flex flex-col min-h-screen">
        
        <!-- Unified Navbar -->
        <header class="custom-card sticky top-0 z-50 px-8 py-4 my-4 rounded-2xl flex items-center justify-between border">
            <div class="flex items-center gap-3">
                <div class="w-3.5 h-3.5 rounded-full bg-sky-500 shadow-md shadow-sky-500/50 animate-pulse"></div>
                <a href="index.html" class="text-xl font-black tracking-wider bg-gradient-to-r from-sky-500 to-indigo-600 bg-clip-text text-transparent">VEXORIS</a>
            </div>
            <div class="flex items-center gap-6">
                <nav class="hidden md:flex items-center gap-6 text-sm font-semibold">
                    <a href="index.html" class="hover:text-sky-500 transition-colors">الرئيسية</a>
                    <a href="about.html" class="text-sky-500 transition-colors">عن النظام</a>
                    <a href="contact.html" class="hover:text-sky-500 transition-colors">تواصل معنا</a>
                    <a href="courses.html" class="hover:text-sky-500 transition-colors">دورات تدريبية</a>
                    <a href="feedback.html" class="hover:text-sky-500 transition-colors">رأيك يهمنا</a>
                </nav>
                <div class="flex items-center gap-3">
                    <button onclick="toggleTheme()" class="btn btn-ghost btn-circle btn-sm text-sky-500 border border-sky-500/30 hover:bg-sky-500/10"><svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg></button>
                    <a href="login.html" class="btn btn-sm bg-sky-500 hover:bg-sky-600 text-slate-950 font-bold border-none px-5 shadow-md shadow-sky-500/20">تسجيل الدخول</a>
                </div>
            </div>
        </header>

        <main class="flex-grow py-12">
            <div class="custom-card p-8 rounded-2xl">
                <h1 class="text-2xl font-black mb-4 text-sky-500">عن منظومة VEXORIS System V2</h1>
                <p class="opacity-80 leading-relaxed">نظام مؤسسي متطور وموحد لإدارة السجلات، التدقيق اللحظي، فصل أطباء التخدير عن الجراحة العامة، واستخراج التقارير الرسمية بأعلى معايير الجودة العالمية.</p>
            </div>
        </main>

        <footer class="custom-card py-6 mb-4 rounded-2xl text-center text-xs opacity-75 border"><p>VEXORIS © 2026</p></footer>
    </div>
    <script>function toggleTheme() { document.documentElement.classList.toggle('dark'); localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light'); }</script>
</body>
</html>
