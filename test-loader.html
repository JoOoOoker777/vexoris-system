<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>اختبار اللودر</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie_light.min.js"></script>
</head>
<body style="background:#04070f; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;">
    <div id="test" style="width:200px; height:200px;"></div>
    <script>
        lottie.loadAnimation({
            container: document.getElementById('test'),
            renderer: 'svg',
            loop: true,
            autoplay: true,
            path: 'assets/loader.json'
        });
    </script>
</body>
</html>
